<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><link rel="icon" href="icons/icon.svg">
  <title>Gesture lab · waiting for show-and-tell</title>
  <link rel="stylesheet" href="vendor/m3-tokens.css">
  <script type="module" src="vendor/material-web.js"></script>
  <script type="module" src="lab-offline.js"></script>
  <style>
    :root { color-scheme: light dark; --md-ref-typeface-brand: system-ui, "Segoe UI", sans-serif; --md-ref-typeface-plain: system-ui, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface); font-family: var(--md-ref-typeface-plain); }
    .card { width: min(560px, calc(100vw - 48px)); padding: 24px; border-radius: 28px; display: flex; flex-direction: column; gap: 16px;
      background: var(--md-sys-color-surface-container-high); }
    .muted { color: var(--md-sys-color-on-surface-variant); }
    code { font: 14px/20px ui-monospace, Consolas, monospace; padding: 2px 6px; border-radius: 6px; background: var(--md-sys-color-surface-container-highest); }
    md-linear-progress { width: 100%; }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="md-typescale-headline-small">Waiting for show-and-tell</div>
    <div class="md-typescale-body-large">The test page comes with show-and-tell's bridge, and no bridge is running right now.</div>
    <div class="md-typescale-body-medium muted">Start an agent session that has show-and-tell, or run <code>node &lt;skill&gt;/bridge serve</code>. This page switches to the test page by itself as soon as it is there.</div>
    <md-linear-progress indeterminate></md-linear-progress>
  </main>
</body>
</html>
