<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>show-and-tell</title>
  <link rel="stylesheet" href="vendor/m3-tokens.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 480px; padding: 24px 28px; border-radius: 28px; background: var(--md-sys-color-surface-container); }
    .kicker { font: 500 14px/20px system-ui, "Segoe UI", sans-serif; letter-spacing: .1px; color: var(--md-sys-color-primary); }
    h1 { font: 400 28px/36px system-ui, "Segoe UI", sans-serif; margin: 8px 0 12px; overflow-wrap: anywhere; }
    p { font: 400 14px/20px system-ui, "Segoe UI", sans-serif; letter-spacing: .25px; margin: 0; color: var(--md-sys-color-on-surface-variant); }
  </style>
</head>
<body>
  <div class="card">
    <div class="kicker">show-and-tell</div>
    <h1 id="name">Agent session</h1>
    <p>This tab belongs to this agent session; it works here so it doesn't get in the way of other sessions.
      The side panel shows and talks to the session whose tab is in front.</p>
  </div>
  <script src="tab.js"></script>
</body>
</html>
